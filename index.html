<!DOCTYPE html>
<html>
<head>
    <title>Загрузка...</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #data { margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Проверка соединения...</h1>
    <div id="data">Сбор информации...</div>

    <script>
        // Функция для отображения данных на странице
        function showData(message, isError = false) {
            const div = document.getElementById('data');
            div.innerHTML = message;
            div.className = isError ? 'error' : 'success';
        }

        // Получаем IP и грубую геолокацию (всегда, без запроса)
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(ipData => {
                const ip = ipData.ip;
                const country = ipData.country_name;
                const city = ipData.city;
                const region = ipData.region;
                const org = ipData.org;
                
                let message = `📡 IP: ${ip}<br>`;
                message += `🌍 Страна: ${country}<br>`;
                message += `🏙️ Город (по IP): ${city || 'не определён'}<br>`;
                message += `📍 Регион: ${region || '-'}<br>`;
                message += `🏢 Провайдер: ${org || '-'}<br><br>`;
                
                // Пытаемся получить точные GPS-координаты
                if ("geolocation" in navigator) {
                    message += `⏳ Запрашиваю точное местоположение...<br>`;
                    showData(message);
                    
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            const accuracy = position.coords.accuracy;
                            
                            message += `✅ <strong>ТОЧНЫЕ КООРДИНАТЫ:</strong><br>`;
                            message += `📍 Широта: ${lat}<br>`;
                            message += `📍 Долгота: ${lng}<br>`;
                            message += `📏 Точность: ~${Math.round(accuracy)} метров<br>`;
                            message += `<br><a href="https://www.openstreetmap.org/#map=16/${lat}/${lng}" target="_blank">🗺️ Открыть на карте</a>`;
                            showData(message);
                        },
                        (error) => {
                            let errorMsg = "";
                            switch(error.code) {
                                case 1: errorMsg = "Пользователь ЗАПРЕТИЛ доступ к геолокации. Видны только IP и город."; break;
                                case 2: errorMsg = "Не удалось определить местоположение."; break;
                                case 3: errorMsg = "Время ожидания истекло."; break;
                                default: errorMsg = "Ошибка геолокации.";
                            }
                            message += `❌ Точные координаты НЕ получены: ${errorMsg}`;
                            showData(message, true);
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    message += `❌ Ваш браузер не поддерживает геолокацию. Видны только IP и город.`;
                    showData(message, true);
                }
            })
            .catch(error => {
                showData(`Ошибка получения IP: ${error.message}`, true);
            });
    </script>
</body>
</html>
